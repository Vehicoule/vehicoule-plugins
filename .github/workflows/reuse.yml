name: REUSE

# ADR 0003 (after Vehicoule's ADR 0009): every file in the repository has its copyright and license declared, in REUSE.toml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reuse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    name: reuse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check licensing (reuse 6.3.0)
        run: pipx run --spec reuse==6.3.0 reuse lint
