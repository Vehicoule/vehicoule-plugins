[workspace]
resolver = "3"
# Plugin crates (plugins/lrclib) are added as task 6 lands.
members = ["tests", "plugins/deezer", "plugins/itunes"]
# Plugins only make sense for wasm32-wasip2; `tests` builds them.
default-members = ["tests"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
# In a plugin, a panic becomes a trap, which the host reports as `internal`.
panic = "abort"
