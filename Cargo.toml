[workspace]
resolver = "3"
members = ["tests", "plugins/deezer", "plugins/itunes", "plugins/lrclib"]
# Plugins ship as wasm32-wasip2 (`tests` builds them so); natively they build too, so a plain
# `cargo test` also runs their unit tests.

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

# Google's Rust style guide, as clippy applies it. The wit-bindgen output opts out with an
# `#[allow]` on its module.
[workspace.lints.clippy]
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
wildcard_imports = "warn"
redundant_clone = "warn"
implicit_clone = "warn"

[profile.release]
opt-level = "s"
lto = true
strip = true
# In a plugin, a panic becomes a trap, which the host reports as `internal`.
panic = "abort"
