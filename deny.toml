# cargo-deny: run in CI on every pull request, on the plugins' workspace and on `conformance/` (and `fuzz/` once it
# exists), with this file.

[graph]
all-features = true

[advisories]
# Any known vulnerability or unmaintained crate fails the check.
yanked = "deny"

[licenses]
# Licenses compatible with distributing the plugins under GPL-3.0 (ADR 0004); the same list as Vehicoule's.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

# The workspace's own crates are GPL-3.0-only and never published; their license is decided by ADR 0004, and
# Vehicoule's plugin host, which `conformance/` builds, by Vehicoule's ADR 0006.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The plugin host, for the conformance test only (ADR 0002).
allow-git = ["https://github.com/Vehicoule/Vehicoule"]
