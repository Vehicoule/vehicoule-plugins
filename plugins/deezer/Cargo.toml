[package]
name = "vehicoule-plugin-deezer"
description = "Search, album, artist and playlist pages, artwork and link import from Deezer's public API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# `cdylib` is the Wasm module turned into a component; `rlib` lets the tests, the fuzz targets and the Kani proofs
# reach the plugin's code (docs/plugin-crates.md).
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
wit-bindgen.workspace = true

[lints]
workspace = true
